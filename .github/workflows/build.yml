name: build

# Builds the runner image and pushes it to GHCR, tagged with the runner version from the Dockerfile and `latest`.
# The repository is public, so this runs on GitHub-hosted runners at no cost and the package can be public.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the runner version
        id: version
        run: |
          version=$(sed -nE 's|^FROM ghcr.io/actions/actions-runner:([0-9.]+)$|\1|p' Dockerfile)
          [ -n "$version" ] || { echo "::error::No runner version in the Dockerfile FROM line"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the tools
        run: |
          docker run --rm --entrypoint bash "$IMAGE:latest" -c \
            'set -e; gh --version; jq --version; python3 -m venv /tmp/v && /tmp/v/bin/pip --version; test -x /home/runner/run.sh'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"
